  - name: powervs-network-missing-owner-tag
    description: |
      SHOULD — PowerVS networks missing a mandatory owner tag.
    resource: ibm.powervs-network
    filters:
      - type: tag
        key: owner
        op: absent
    actions:
      - type: tag
        tags:
          custodian-review: "missing-owner-tag"

  # ---------------------------------------------------------------------------
  # ibm.powervs-image
  # ---------------------------------------------------------------------------

  - name: powervs-image-stale
    description: |
      CAN — Imported PowerVS images older than 365 days. May be stale.
    resource: ibm.powervs-image
    filters:
      - type: age
        op: gt
        days: 1
    actions:
      - type: tag
        tags:
          custodian-review: "stale-image"

  - name: powervs-image-not-active
    description: |
      SHOULD — PowerVS images not in active state.
    resource: ibm.powervs-image
    filters:
      - type: value
        key: state
        op: ne
        value: active
    actions:
      - type: tag
        tags:
          custodian-review: "image-not-active"

  # ---------------------------------------------------------------------------
  # ibm.powervs-ssh-key
  # ---------------------------------------------------------------------------

  - name: powervs-ssh-key-empty-description
    description: |
      SHOULD — PowerVS SSH keys with empty description. Flag with custodian warning.
    resource: ibm.powervs-ssh-key
    filters:
      - type: value
        key: description
        op: eq
        value: ""
    actions:
      - type: append-description
        notice: "[custodian] No description provided - please document key owner and purpose."
