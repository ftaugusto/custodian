  # ===========================================================================
  # SHOULD — Resource marked for operation past deadline
  # Executes the deferred action on resources that have passed their deadline.
  # ===========================================================================

  - name: cross-vpc-instance-marked-for-op
    resource: ibm.vpc-instance
    description: "SHOULD — Execute deferred delete on vpc-instance past mark-for-op deadline."
    filters:
      - type: marked-for-op
        op: delete
    actions:
      - type: delete


  - name: cross-iam-service-id-marked-for-op
    resource: ibm.iam-service-id
    description: "SHOULD — Execute deferred delete on iam-service-id past mark-for-op deadline."
    filters:
      - type: marked-for-op
        op: delete
    actions:
      - type: delete

  # ===========================================================================
  # CAN — Resource created more than 365 days ago with no governance tags
  # ===========================================================================

  - name: cross-vpc-instance-stale-untagged
    resource: ibm.vpc-instance
    description: "CAN — vpc-instance older than 365 days with no owner tag."
    filters:
      - type: age
        op: gt
        days: 365
      - type: tag
        key: owner
        op: absent
    actions:
      - type: mark-for-op
        op: delete
        days: 14

  - name: cross-vpc-volume-stale-untagged
    resource: ibm.vpc-volume
    description: "CAN — vpc-volume older than 365 days with no owner tag."
    filters:
      - type: age
        op: gt
        days: 365
      - type: tag
        key: owner
        op: absent
    actions:
      - type: tag
        tags:
          custodian-review: "stale-untagged"

  - name: cross-cos-bucket-stale-untagged
    resource: ibm.cos-bucket
    description: "CAN — cos-bucket older than 365 days with no owner tag."
    filters:
      - type: age
        op: gt
        days: 365
      - type: tag
        key: owner
        op: absent
    actions:
      - type: tag
        tags:
          custodian-review: "stale-untagged"

  - name: cross-kms-key-stale-untagged
