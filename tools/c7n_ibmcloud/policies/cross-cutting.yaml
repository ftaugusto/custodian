  # ===========================================================================
  # SHOULD — Resource in wrong resource group
  # Applies only to resource types that support the resource-group filter.
  # Update `value` to match your approved resource group name.
  # ===========================================================================

  - name: cross-vpc-instance-wrong-resource-group
    resource: ibm.vpc-instance
    description: "SHOULD — vpc-instance not in the approved resource group."
    filters:
      - type: resource-group
        op: ne
        value: "approved-resource-group"
    actions:
      - type: tag
        tags:
          custodian-wrong-resource-group: "true"

  - name: cross-vpc-volume-wrong-resource-group
    resource: ibm.vpc-volume
    description: "SHOULD — vpc-volume not in the approved resource group."
    filters:
      - type: resource-group
        op: ne
        value: "approved-resource-group"
    actions:
      - type: tag
        tags:
          custodian-wrong-resource-group: "true"

  - name: cross-cos-bucket-wrong-resource-group
    resource: ibm.cos-bucket
    description: "SHOULD — cos-bucket not in the approved resource group."
    filters:
      - type: tag
        key: resource_group
        op: ne
        value: "approved-resource-group"
    actions:
      - type: tag
        tags:
          custodian-wrong-resource-group: "true"

  - name: cross-iks-cluster-wrong-resource-group
