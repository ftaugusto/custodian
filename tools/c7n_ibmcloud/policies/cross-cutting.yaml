# Cross-cutting governance policies
# These policies apply the same checks across every taggable resource type
# in c7n_ibmcloud. Run this file alongside the per-service policy files.
#
# Resource types covered:
#   VPC:     vpc-instance, vpc-bare-metal, vpc-dedicated-host, vpc-instance-group,
#            vpc-instance-template, vpc-network, vpc-subnet, vpc-security-group,
#            vpc-network-acl, vpc-public-gateway, vpc-transit-gateway, vpc-vpn-gateway,
#            vpc-load-balancer, vpc-floating-ip, vpc-ssh-key, vpc-volume, vpc-snapshot,
#            vpc-backup-policy, vpc-file-share
#   COS:     cos-bucket
#   KMS:     kms-key
#   IKS:     iks-cluster, roks-cluster, iks-worker-pool
#   PowerVS: powervs-instance, powervs-volume, powervs-network
#   DBaaS:   dbaas-postgresql, dbaas-mysql, dbaas-mongodb, dbaas-redis,
#            dbaas-elasticsearch, dbaas-cassandra, dbaas-rabbitmq, dbaas-db2
#   IAM:     iam-service-id  (only IAM resource type with full tagging support)
#
# NOTE: iam-user, iam-api-key, iam-access-group, iam-policy, iam-trusted-profile,
#       kms-key-ring, powervs-image, and powervs-ssh-key do NOT support GlobalTaggingV1
#       tagging and are excluded from this file. See per-service policy files for those.

policies:

  # ===========================================================================
  # MUST — Missing `owner` tag
  # ===========================================================================

  - name: cross-vpc-instance-missing-owner
    resource: ibm.vpc-instance
    description: "MUST — vpc-instance missing owner tag."
    filters:
      - type: tag
        key: owner
        op: absent
    actions:
      - type: mark-for-op
        op: delete
        days: 3

  - name: cross-vpc-bare-metal-missing-owner
    resource: ibm.vpc-bare-metal
    description: "MUST — vpc-bare-metal missing owner tag."
    filters:
      - type: tag
        key: owner
        op: absent
    actions:
      - type: tag
        tags:
          custodian-missing-owner: "true"

