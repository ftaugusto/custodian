[project]
authors = [
    {name = "Cloud Custodian Project"},
]
license = "Apache-2.0"
requires-python = "<4.0.0,>=3.9.2"
dependencies = [
    "c7n",
    "ibm-cloud-sdk-core>=3.18",
    "ibm-platform-services>=0.53",
    "ibm-vpc>=0.20",
    "ibm-cos-sdk>=2.13",
    "requests>=2.31",
    "packaging>=21.0",
]
name = "c7n_ibmcloud"
version = "0.1.0"
description = "Cloud Custodian - IBM Cloud Provider"
readme = "readme.md"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Distributed Computing",
]

[project.entry-points."c7n.providers"]
ibm = "c7n_ibmcloud.entry:initialize_ibm"

[project.urls]
homepage = "https://cloudcustodian.io"
repository = "https://github.com/cloud-custodian/cloud-custodian"
documentation = "https://cloudcustodian.io/docs/"

[dependency-groups]
dev = [
    "pytest",
    "responses>=0.23",
    "freezegun>=1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["c7n_ibmcloud"]
